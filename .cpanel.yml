---
deployment:
  tasks:
    - export APPPATH=/home/darkftga/darkframe-laravel
    - export WEBROOT=/home/darkftga/public_html
    - /bin/mkdir -p $APPPATH
    - /bin/cp -R * $APPPATH
    - /bin/rm -rf $APPPATH/public
    - /bin/cp -R public/* $WEBROOT/
    - /bin/cp -R public/.htaccess $WEBROOT/ 2>/dev/null || true
